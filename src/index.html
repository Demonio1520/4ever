<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/1d4b5ad042.js" crossorigin="anonymous"></script>
    <title>4ever</title>
</head>
<body>
    <template id="game">
        <!-- Site Style -->
        <style></style>
        <style id="background"></style>

        <!-- Site Header -->
        <header class="site-header">
            <div class="level">
                <p id="level"></p>
            </div>
            
            <div class="exp-bar"></div>

            <div class="div-options">
                <i id="options" class="fa-solid fa-gear"></i>
            </div>
        </header>

        <!-- Site Main -->

        <main class="site-main">
            <div class="message"></div>
            <div class="flower"></div>
            <div class="container-1"></div>
            <div class="container-2"></div>
        </main>

        <!-- Site Footer -->

        <footer class="site-footer">
            <div class="div-new"></div>

            <div class="div-buttons">
                <button id="btn-main" class="btn btn-outline-danger">Inicio</button>
                <button id="btn-games" class="btn btn-outline-primary">Juegos</button>
                <button id="btn-email" class="btn btn-outline-light"><img src="./assets/img/email.png" alt="Emails"></button>
            </div>

            <div class="div-version">
                <p>Version</p>
            </div>
        </footer>
    </template>
</body>
</html>
